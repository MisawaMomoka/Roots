<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>やせ習慣1Day講義</title>
<meta name="description" content="LINE限定の講義動画と、個別相談会の申込">
<!--
  講義動画ページ（1ページ目）：視聴期限 → 動画（自動再生・音の有効化）→ 参加ボタン → 2ページ目（booking.html：カレンダー＋フォーム）
  設定は <script id="config"> の JSON だけ。手順は README.md
-->
<script id="config" type="application/json">
{
  "title": "やせ習慣1Day講義",
  "lead": "まずはこちらの動画をご覧ください",
  "video": { "youtubeId": "", "vimeoId": "", "mp4Url": "", "posterUrl": "" },
  "speedNote": "※1.25倍速がおすすめです",

  "deadline": { "mode": "evergreen", "hours": 72, "fixedAt": "" },
  "deadlineTitle": "動画のご視聴期限",

  "unlockAfterSeconds": 0,
  "lockedNote": "一定時間ご視聴後、参加ボタンを表示します",

  "ctaLabel": "【先着20名】無料で参加する",
  "ctaNote": "※枠が埋まり次第無料での開催は終了します",
  "bookingPage": "booking.html",

  "bonusTitle": "特典動画",
  "bonus": []
}
</script>
<style>
  :root { --bg: #eaf6fb; --panel: #f4fbfe; --card: #fff; --text: #1f2937; --muted: #6b7280; --blue: #1a8fd8; --blue-dark: #1673b1; --line: #b9e2f5; --orange: #f5a623; --orange-dark: #d98c0a; --border: #e5e7eb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; line-height: 1.7; }
  main { max-width: 680px; margin: 0 auto; padding: 24px 16px 64px; }
  .deadline { text-align: center; margin-bottom: 20px; }
  .deadline h1 { font-size: 1.35rem; font-weight: 600; color: var(--blue-dark); margin: 0 0 12px; letter-spacing: .04em; }
  .clock { display: flex; justify-content: center; gap: 12px; }
  .clock .unit { display: flex; align-items: flex-end; gap: 4px; }
  .clock .num { width: 64px; height: 64px; border: 3px solid var(--blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: var(--blue); background: #fff; font-variant-numeric: tabular-nums; }
  .clock .lbl { font-size: .8rem; font-weight: 700; padding-bottom: 4px; }
  .expired { color: #e53935; font-weight: 700; margin-top: 8px; }
  .pill { border: 2px solid var(--line); border-radius: 999px; background: var(--panel); text-align: center; padding: 16px; color: var(--blue-dark); font-weight: 700; letter-spacing: .06em; margin: 16px 0; }
  .video-wrap { position: relative; background: #fff; border-radius: 12px; padding: 10px; box-shadow: 0 6px 24px rgba(26,143,216,.12); }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; overflow: hidden; }
  .video iframe, .video video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .unmute { position: absolute; top: 20px; right: 20px; z-index: 2; background: rgba(0,0,0,.72); color: #fff; border: 0; border-radius: 8px; padding: 10px 14px; font-size: .95rem; font-weight: 700; cursor: pointer; }
  .note { text-align: right; color: var(--muted); font-size: .9rem; margin: 8px 0 0; }
  .cta { display: block; width: 100%; text-align: center; background: var(--orange); color: #fff; text-decoration: none; border: 0; border-bottom: 6px solid var(--orange-dark); border-radius: 6px; padding: 18px; font-size: 1.15rem; font-weight: 700; letter-spacing: .04em; margin: 16px 0 8px; }
  .cta:active { transform: translateY(2px); border-bottom-width: 4px; }
  .cta-note { text-align: center; color: var(--text); font-size: .95rem; margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-top: 18px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 8px; }
  .bonus-item { margin-top: 12px; }
  .bonus-item h3 { font-size: .95rem; margin: 0 0 6px; }
  .setup { background: #fff3cd; color: #7a5200; border-radius: 8px; padding: 12px; margin: 12px 0; font-size: .9rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <section class="deadline" id="deadline">
    <h1 id="deadlineTitle"></h1>
    <div class="clock">
      <div class="unit"><div class="num" id="dD">0</div><div class="lbl">日</div></div>
      <div class="unit"><div class="num" id="dH">0</div><div class="lbl">時間</div></div>
      <div class="unit"><div class="num" id="dM">0</div><div class="lbl">分</div></div>
      <div class="unit"><div class="num" id="dS">0</div><div class="lbl">秒</div></div>
    </div>
    <div class="expired hidden" id="expired">視聴期限を過ぎています</div>
  </section>

  <div class="pill" id="lead"></div>

  <div class="setup hidden" id="setupNote">動画が設定されていません。index.html の config の "video" → "youtubeId" に YouTube の動画ID（11文字）を入れて配備してください。</div>

  <div class="video-wrap" id="videoWrap">
    <div class="video" id="video"></div>
    <button class="unmute hidden" id="unmute" type="button">🔊 音の有効化</button>
  </div>
  <p class="note" id="speedNote"></p>

  <div class="pill hidden" id="lockedNote"></div>

  <section id="unlocked" class="hidden">
    <a class="cta" id="cta" href="booking.html"></a>
    <p class="cta-note" id="ctaNote"></p>

    <section class="card hidden" id="bonusCard">
      <h2 id="bonusTitle"></h2>
      <div id="bonusList"></div>
    </section>
  </section>
</main>

<script>
(function () {
  var cfg; try { cfg = JSON.parse(document.getElementById('config').textContent); } catch (e) { cfg = {}; }
  var $ = function (id) { return document.getElementById(id); };
  var text = function (id, v) { $(id).textContent = v || ''; };
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var KEY = 'lecture:v2:';

  document.title = cfg.title || '講義動画';
  text('lead', cfg.lead); text('speedNote', cfg.speedNote); text('deadlineTitle', cfg.deadlineTitle);
  text('lockedNote', cfg.lockedNote); text('cta', cfg.ctaLabel || '無料で参加する'); text('ctaNote', cfg.ctaNote);
  $('cta').href = (cfg.bookingPage || 'booking.html') + location.search;

  // ---------- 視聴期限 ----------
  (function () {
    var d = cfg.deadline || {}, end;
    if (d.mode === 'fixed' && d.fixedAt) end = new Date(d.fixedAt).getTime();
    else { var first = Number(store.get(KEY + 'first') || 0); if (!first) { first = Date.now(); store.set(KEY + 'first', String(first)); } end = first + (Number(d.hours) || 72) * 3600000; }
    if (!isFinite(end)) { $('deadline').classList.add('hidden'); return; }
    function tick() { var s = Math.floor(Math.max(0, end - Date.now()) / 1000); text('dD', Math.floor(s / 86400)); text('dH', Math.floor(s % 86400 / 3600)); text('dM', Math.floor(s % 3600 / 60)); text('dS', s % 60); if (s <= 0) $('expired').classList.remove('hidden'); }
    tick(); setInterval(tick, 1000);
  })();

  // ---------- 動画 ----------
  var need = Number(cfg.unlockAfterSeconds) || 0;
  var watched = Number(store.get(KEY + 'watched') || 0);
  var unlocked = need <= 0 || store.get(KEY + 'unlocked') === '1';
  function unlock() { unlocked = true; store.set(KEY + 'unlocked', '1'); $('lockedNote').classList.add('hidden'); $('unlocked').classList.remove('hidden'); }
  function onProgress(sec) { if (unlocked) return; if (sec > watched) { watched = sec; store.set(KEY + 'watched', String(Math.floor(watched))); } if (watched >= need) unlock(); }

  function mountVideo(v, box, opts) {
    v = v || {}; opts = opts || {};
    if (v.youtubeId) {
      var id = 'yt' + Math.random().toString(36).slice(2);
      var yt = document.createElement('iframe'); yt.id = id;
      yt.src = 'https://www.youtube.com/embed/' + encodeURIComponent(v.youtubeId) + '?rel=0&playsinline=1&enablejsapi=1&origin=' + encodeURIComponent(location.origin) + (opts.autoplay ? '&autoplay=1&mute=1' : '');
      yt.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture'; yt.allowFullscreen = true; yt.title = opts.title || '動画';
      box.appendChild(yt);
      if (!opts.track) return null;
      var api = document.createElement('script'); api.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(api);
      var p = null;
      window.onYouTubeIframeAPIReady = function () { p = new YT.Player(id, { events: { onReady: function () { setInterval(function () { try { onProgress(p.getCurrentTime()); } catch (e) {} }, 1000); } } }); };
      return { unmute: function () { try { p.unMute(); p.setVolume(100); } catch (e) {} } };
    }
    if (v.vimeoId) {
      var vm = document.createElement('iframe');
      vm.src = 'https://player.vimeo.com/video/' + encodeURIComponent(v.vimeoId) + '?dnt=1&playsinline=1' + (opts.autoplay ? '&autoplay=1&muted=1' : '');
      vm.allow = 'autoplay; fullscreen; picture-in-picture'; vm.allowFullscreen = true; vm.title = opts.title || '動画'; box.appendChild(vm);
      return opts.track ? { unmute: function () { vm.contentWindow.postMessage(JSON.stringify({ method: 'setVolume', value: 1 }), '*'); } } : null;
    }
    if (v.mp4Url) {
      var el = document.createElement('video'); el.src = v.mp4Url; el.controls = true; el.playsInline = true; el.preload = 'metadata';
      if (v.posterUrl) el.poster = v.posterUrl; if (opts.autoplay) { el.autoplay = true; el.muted = true; } box.appendChild(el);
      if (opts.track) el.addEventListener('timeupdate', function () { onProgress(el.currentTime); });
      return opts.track ? { unmute: function () { el.muted = false; el.play(); } } : null;
    }
    return undefined;
  }

  var player = mountVideo(cfg.video, $('video'), { autoplay: true, track: true, title: cfg.title });
  if (player === undefined) { $('videoWrap').classList.add('hidden'); $('speedNote').classList.add('hidden'); $('setupNote').classList.remove('hidden'); unlock(); }
  else if (player) { $('unmute').classList.remove('hidden'); $('unmute').addEventListener('click', function () { player.unmute(); $('unmute').classList.add('hidden'); }); }
  if (unlocked) unlock(); else $('lockedNote').classList.remove('hidden');

  var bonus = (Array.isArray(cfg.bonus) ? cfg.bonus : []).filter(function (b) { return b && (b.youtubeId || b.vimeoId || b.mp4Url); });
  if (bonus.length) {
    $('bonusCard').classList.remove('hidden'); text('bonusTitle', cfg.bonusTitle || '特典動画');
    bonus.forEach(function (b) { var item = document.createElement('div'); item.className = 'bonus-item'; var h = document.createElement('h3'); h.textContent = b.title || '特典動画'; item.appendChild(h); var vb = document.createElement('div'); vb.className = 'video'; item.appendChild(vb); mountVideo(b, vb, { title: b.title }); $('bonusList').appendChild(item); });
  }
})();
</script>
</body>
</html>
