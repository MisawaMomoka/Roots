# create-line-harness が生成した wrangler.toml（三沢さんの環境）と同じ内容。
# GitHub Actions（.github/workflows/deploy-worker.yml）がこのファイルを使って配備する。
name = "roots-line"
main = "dist/release/index.js"
no_bundle = true
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "e8193463b99b767e99c0b65cf6da3681"

[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "roots-line"
database_id = "0c626108-e58c-4a71-8673-6cd202096c1e"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "roots-line-images"

[triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

[vars]
WORKER_NAME = "roots-line"
ADMIN_PAGES_PROJECT = "roots-line-admin-a711620d"
LIFF_PAGES_PROJECT = ""
D1_DATABASE_ID = "0c626108-e58c-4a71-8673-6cd202096c1e"
MANIFEST_URL = "https://github.com/Shudesu/line-harness-oss/releases/latest/download/release-manifest.json"
WORKER_PUBLIC_URL = "https://roots-line.re-tro.workers.dev"
ADMIN_PUBLIC_URL = "https://roots-line-admin-a711620d.pages.dev"
LIFF_PUBLIC_URL = "https://roots-line.re-tro.workers.dev"
CF_ACCOUNT_ID = "e8193463b99b767e99c0b65cf6da3681"
